[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentient-signals"
version = "0.1.0"
description = "Local text and audio emotion recognition with a grounded response policy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==15.1.0",
  "numpy==2.5.3",
  "pydantic==2.13.5",
  "scikit-learn==1.9.1",
  "torch==2.14.0",
]

[project.optional-dependencies]
encoders = [
  "sentence-transformers==5.7.0",
  "transformers==5.17.0",
]
asr = ["faster-whisper==1.2.1"]
serve = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]
dev = [
  "psutil==7.2.2",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[project.scripts]
sentient-prepare = "sentient_signals.cli:prepare_main"
sentient-cache = "sentient_signals.cli:cache_main"
sentient-train = "sentient_signals.cli:train_main"
sentient-predict = "sentient_signals.cli:predict_main"
sentient-benchmark = "sentient_signals.cli:benchmark_main"
sentient-benchmark-e2e = "sentient_signals.cli:e2e_benchmark_main"
sentient-serve = "sentient_signals.cli:serve_main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
